id: io.github.l1ngus.lucid-spell
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: lucid-spell

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
  - org.freedesktop.Sdk.Extension.rust-stable

build-options:
  append-path: /usr/lib/sdk/node22/bin:/usr/lib/sdk/rust-stable/bin

modules:
  - name: lucid-spell
    buildsystem: simple
    env:
      HOME: /run/build/lucid-spell
      CARGO_HOME: /run/build/lucid-spell/src-tauri
      XDG_CACHE_HOME: /run/build/lucid-spell/flatpak-node/cache
      npm_config_cache: /run/build/lucid-spell/flatpak-node/cache
    sources:
      - type: git
        url: https://github.com/l1ngus/lucid-spell.git
        tag: v0.1.0
      - cargo-sources.json
      - node-sources.json
    build-commands:
      - mkdir -p src-tauri/.cargo
      - echo -e '[source.crates-io]\nreplace-with = "vendored-sources"\n\n[source.vendored-sources]\ndirectory = "/run/build/lucid-spell/cargo/vendor"' > src-tauri/.cargo/config.toml
      - npm install --offline --no-audit --no-fund
      - npm run tauri build -- --no-bundle
      - install -Dm755 src-tauri/target/release/lucid-spell /app/bin/lucid-spell
      - install -Dm644 flatpak/io.github.l1ngus.lucid-spell.desktop /app/share/applications/io.github.l1ngus.lucid-spell.desktop
      - install -Dm644 flatpak/io.github.l1ngus.lucid-spell.metainfo.xml /app/share/metainfo/io.github.l1ngus.lucid-spell.metainfo.xml
      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/io.github.l1ngus.lucid-spell.png
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/io.github.l1ngus.lucid-spell.png
      - install -Dm644 src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/io.github.l1ngus.lucid-spell.png